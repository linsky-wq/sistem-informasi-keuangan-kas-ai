
name: PHP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql
          
      - name: Check PHP syntax
        run: |
          find app tests -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Verify CI configuration
        run: |
          test -f .gitignore
          test ! -f .env
          echo "PHP syntax and repository checks passed."
